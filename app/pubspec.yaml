name: chesslens
description: Scan chess diagrams from books and photos, then analyze, play or solve them with Stockfish, fully offline.
publish_to: 'none'

# versionName+versionCode. CI overrides the build number with the run number.
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  shared_preferences: ^2.3.2
  chessground: ^11.1.0
  dartchess: ^0.15.0
  multistockfish: ^0.6.1
  fast_immutable_collections: ^12.0.0
  sqflite: ^2.4.6
  path_provider: ^2.1.6
  path: ^1.9.0
  flutter_litert: ^4.1.1
  image: ^4.12.0
  image_picker: ^1.2.4
  file_picker: ^13.3.3
  pdfrx: ^2.12.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: '>=5.0.0 <7.0.0'
  sqflite_common_ffi: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - assets/models/
