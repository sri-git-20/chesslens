name: Android build

on:
  push:
    branches: ['**']
    tags-ignore: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Analyze, test and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show tool versions
        run: flutter --version

      # The Android and iOS project folders are generated by the Flutter
      # tool on the first run and committed back, so later changes to them
      # are ordinary reviewed edits.
      - name: Generate Android and iOS folders (first run only)
        run: |
          if [ -d android ]; then
            echo "Platform folders already present."
            exit 0
          fi
          flutter create --org io.github.srigit20 --project-name chesslens \
            --platforms=android,ios .
          sed -i 's/android:label="chesslens"/android:label="ChessLens"/' \
            android/app/src/main/AndroidManifest.xml
          perl -0pi -e 's#(<key>CFBundleDisplayName</key>\s*<string>)[^<]*(</string>)#${1}ChessLens${2}#' \
            ios/Runner/Info.plist
          echo "GENERATED=true" >> "$GITHUB_ENV"

      - name: Get packages
        run: flutter pub get

      - name: Commit generated folders
        if: env.GENERATED == 'true' && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .
          git commit -m "chore: generate Android and iOS project folders" \
            -m "Created by flutter create in CI."
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      # Development builds are signed with a fixed, public test key so a new
      # build installs over the previous one. Store releases use a separate,
      # secret upload key (added before the Play release).
      - name: Install development signing key
        run: |
          mkdir -p ~/.android
          cp ../ci/dev-debug.keystore ~/.android/debug.keystore

      - name: Build release APK
        run: |
          flutter build apk --release --split-per-abi \
            --build-number=${{ github.run_number }} \
            --dart-define=BUILD_NUMBER=${{ github.run_number }}

      - uses: actions/upload-artifact@v6
        with:
          name: chesslens-apk
          path: app/build/app/outputs/flutter-apk/app-*-release.apk
          retention-days: 14

      - name: Publish development build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk chesslens-dev.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk chesslens-dev-32bit.apk
          gh release delete dev-latest --yes --cleanup-tag || true
          gh release create dev-latest chesslens-dev.apk chesslens-dev-32bit.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Latest development build" \
            --notes "Built from commit ${GITHUB_SHA::7}, run ${{ github.run_number }}. On your Android phone, download chesslens-dev.apk and open it to install. Use chesslens-dev-32bit.apk only on old phones where the main file will not install."
