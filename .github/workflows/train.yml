name: Train recognition models

# Push to m2-training (training/** or this file): smoke run by default, full run if the
# head commit message contains "[full]". workflow_dispatch lets you choose.
on:
  push:
    branches: [m2-training]
    paths: ['training/**', '.github/workflows/train.yml']
  workflow_dispatch:
    inputs:
      mode:
        description: smoke (tiny, minutes) or full (about 3 h)
        type: choice
        default: full
        options: [smoke, full, analyze, retrain]
      models:
        description: retrain only, comma list (squares, detector, corners)
        default: squares
      squares_minutes:
        description: retrain only, squares training minutes
        default: '240'
      detector_minutes:
        description: retrain only, detector training minutes
        default: '40'
      pages:
        description: retrain only, number of synthetic pages
        default: '30000'

concurrency:
  group: train-m2
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    defaults:
      run:
        working-directory: training
    env:
      TF_CPP_MIN_LOG_LEVEL: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v5

      - name: Decide mode
        id: mode
        env:
          MSG: ${{ github.event.head_commit.message }}
          INPUT: ${{ github.event.inputs.mode }}
          IN_MODELS: ${{ github.event.inputs.models }}
          IN_SQ: ${{ github.event.inputs.squares_minutes }}
          IN_DET: ${{ github.event.inputs.detector_minutes }}
          IN_PAGES: ${{ github.event.inputs.pages }}
        run: |
          if [ -n "$INPUT" ]; then m="$INPUT"
          elif [[ "$MSG" == *"[analyze]"* ]]; then m=analyze
          elif [[ "$MSG" == *"[retrain]"* ]]; then m=retrain
          elif [[ "$MSG" == *"[full]"* ]]; then m=full
          else m=smoke; fi
          models="detector,corners,squares"; pages=10000
          if [ "$m" = retrain ]; then models="${IN_MODELS:-squares}"; pages="${IN_PAGES:-30000}"; fi
          msq="${IN_SQ:-240}"; mdet="${IN_DET:-40}"
          echo "mode=$m" >> "$GITHUB_OUTPUT"
          echo "MODE: $m models: $models"
          if [ "$m" = full ]; then
            printf '%s\n' PAGES=10000 SQPB=2 MIN_DET=55 MIN_COR=30 MIN_SQ=65 EVAL_PAGES=100 SPE=120 ANALYZE_PAGES=300 >> "$GITHUB_ENV"
          elif [ "$m" = retrain ]; then
            printf '%s\n' PAGES=$pages SQPB=2 MIN_DET=$mdet MIN_COR=30 MIN_SQ=$msq EVAL_PAGES=100 SPE=120 ANALYZE_PAGES=300 >> "$GITHUB_ENV"
          else
            printf '%s\n' PAGES=300 SQPB=1 MIN_DET=1.5 MIN_COR=1 MIN_SQ=1.5 EVAL_PAGES=4 SPE=15 ANALYZE_PAGES=60 >> "$GITHUB_ENV"
          fi
          printf '%s\n' MODE=$m TRAIN_MODELS=$models >> "$GITHUB_ENV"
          if [ "$models" = squares ]; then echo GEN_FLAGS=--only-squares >> "$GITHUB_ENV"; else echo GEN_FLAGS= >> "$GITHUB_ENV"; fi
          if [ "$m" = analyze ]; then echo ANALYZE_PAGES=600 >> "$GITHUB_ENV"; fi

      - name: Free disk space
        working-directory: .
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android || true
          df -h /

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: training/requirements.txt

      - name: System packages (fonts, cairo)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends fonts-freefont-ttf fonts-noto-core fonts-dejavu libcairo2 || true
          fc-list | wc -l

      - name: Python dependencies
        run: |
          pip install -r requirements.txt
          python -c "import tensorflow as tf, keras, numpy, cv2, cairosvg, chess; print('tf', tf.__version__, 'keras', keras.__version__, 'numpy', numpy.__version__, 'cv2', cv2.__version__)"

      - uses: actions/cache@v4
        with:
          path: training/work/svg_cache
          key: svg-cache-v1

      - name: Error analysis of the squares model
        if: env.MODE == 'analyze'
        run: python analyze_squares.py --models ../app/assets/models --pages $ANALYZE_PAGES

      - name: Generate synthetic data
        if: env.MODE != 'analyze'
        run: ./timeit.sh generate_data python gen_data.py --out work/data --pages $PAGES --sq-per-board $SQPB $GEN_FLAGS

      - name: Train detector
        if: env.MODE != 'analyze' && contains(env.TRAIN_MODELS, 'detector')
        run: ./timeit.sh train_detector python train.py --model detector --data work/data --minutes $MIN_DET --batch 32 --steps-per-epoch $SPE

      - name: Train corners
        if: env.MODE != 'analyze' && contains(env.TRAIN_MODELS, 'corners')
        run: ./timeit.sh train_corners python train.py --model corners --data work/data --minutes $MIN_COR --batch 32 --steps-per-epoch $SPE

      - name: Train squares
        if: env.MODE != 'analyze' && contains(env.TRAIN_MODELS, 'squares')
        run: ./timeit.sh train_squares python train.py --model squares --data work/data --minutes $MIN_SQ --batch 64 --steps-per-epoch $SPE

      - name: Export to TFLite and verify
        if: env.MODE != 'analyze'
        run: ./timeit.sh export python export_tflite.py --weights work/models --data work/data --out ../app/assets/models --only $TRAIN_MODELS

      - name: Evaluate
        if: env.MODE != 'analyze'
        run: ./timeit.sh evaluate python evaluate.py --models ../app/assets/models --pages $EVAL_PAGES --out work/metrics.json

      - name: Error analysis (squares)
        if: env.MODE != 'analyze'
        run: python analyze_squares.py --models ../app/assets/models --pages $ANALYZE_PAGES

      - name: Fixtures
        if: env.MODE != 'analyze'
        run: ./timeit.sh fixtures python make_fixtures.py --models ../app/assets/models --out ../app/test/fixtures/scan

      - name: Write MODELS.md and REPORT.md
        if: env.MODE != 'analyze'
        run: python write_docs.py --mode ${{ steps.mode.outputs.mode }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m2-outputs-${{ steps.mode.outputs.mode }}
          path: |
            app/assets/models
            app/test/fixtures/scan
            training/REPORT.md
            training/work/metrics.json
            training/work/timings.txt
            training/work/models
            training/work/failures
            training/work/data/meta.json
            training/work/analysis
            training/train_info.json
            training/export_info.json
          if-no-files-found: warn

      - name: Commit outputs to m2-training
        if: (steps.mode.outputs.mode == 'full' || steps.mode.outputs.mode == 'retrain') && github.ref == 'refs/heads/m2-training'
        working-directory: .
        run: |
          if [ "$PAGES" -lt 2000 ]; then echo "tiny test run, not committing"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f app/assets/models app/test/fixtures/scan training/REPORT.md training/train_info.json training/export_info.json
          git commit -m "Add trained recognition models, fixtures and report

          Co-Authored-By: Claude Sonnet 5.5 <noreply@anthropic.com>
          Claude-Session: https://claude.ai/code/session_018Ve1Kfo5FQSPvwLcRni2L1" || { echo "nothing to commit"; exit 0; }
          for i in 1 2 3; do
            git pull --rebase origin m2-training && git push origin HEAD:m2-training && break
            sleep 10
          done
